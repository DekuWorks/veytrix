name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veytrix
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: veytrix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veytrix -d veytrix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VEYTRIX_ENV: local
      VEYTRIX_ENABLE_LIVE_BROKER: "0"
      DATABASE_URL: postgresql+psycopg://veytrix:local-dev-only@127.0.0.1:5432/veytrix
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret scan
        run: python scripts/scan_secrets.py

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and audit
        run: |
          python -m pip install -e ".[dev]"
          pip-audit
